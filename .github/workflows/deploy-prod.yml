name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Optional notes/reason for this manual deployment'
        required: false
        type: string

jobs:
  sast:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./spelling-scholar-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: spelling-scholar-fe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: spelling-scholar-fe/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run SAST Scan
        run: npm audit --audit-level=critical

  test:
    name: Run Unit Tests
    needs: sast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./spelling-scholar-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: spelling-scholar-fe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: spelling-scholar-fe/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_VITE_SUPABASE_PUBLISHABLE_KEY }}

  verify:
    name: Verify Secrets
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify Environment Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && MISSING="$MISSING VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && MISSING="$MISSING VERCEL_ORG_ID"
          [ -z "${{ secrets.PROD_VERCEL_PROJECT_ID }}" ] && MISSING="$MISSING PROD_VERCEL_PROJECT_ID"
          [ -z "${{ secrets.PROD_VITE_API_BASE_URL }}" ] && MISSING="$MISSING PROD_VITE_API_BASE_URL"
          [ -z "${{ secrets.PROD_VITE_SENTRY_DSN }}" ] && MISSING="$MISSING PROD_VITE_SENTRY_DSN"
          [ -z "${{ secrets.PROD_VITE_SUPABASE_URL }}" ] && MISSING="$MISSING PROD_VITE_SUPABASE_URL"
          [ -z "${{ secrets.PROD_VITE_SUPABASE_PUBLISHABLE_KEY }}" ] && MISSING="$MISSING PROD_VITE_SUPABASE_PUBLISHABLE_KEY"
          
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub Secrets:$MISSING"
            exit 1
          fi

  deploy:
    name: Deploy to Vercel (Prod)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./spelling-scholar-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: spelling-scholar-fe

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.PROD_VITE_API_BASE_URL || secrets.PROD_API_BASE_URL }}" >> .env
          echo "VITE_SENTRY_DSN=${{ secrets.PROD_VITE_SENTRY_DSN || secrets.PROD_SENTRY_DSN }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.PROD_VITE_SUPABASE_URL || secrets.PROD_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_VITE_SUPABASE_PUBLISHABLE_KEY || secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_HUBSPOT_TRACKING_ID=${{ secrets.PROD_VITE_HUBSPOT }}" >> .env
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}

      - name: Create Deployment Summary
        run: |
          echo "### 🚀 Vercel Prod Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL:** [${{ env.DEPLOY_URL }}](${{ env.DEPLOY_URL }})" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.description }}" ]; then
            echo "- **Description/Notes:** ${{ github.event.inputs.description }}" >> $GITHUB_STEP_SUMMARY
          fi