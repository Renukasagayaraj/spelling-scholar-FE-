name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Optional notes/reason for this manual deployment'
        required: false
        type: string

jobs:
  sast:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./spelling-scholar-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: spelling-scholar-fe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: spelling-scholar-fe/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run SAST Scan
        run: npm audit --audit-level=critical

  test:
    name: Run Unit Tests
    needs: sast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./spelling-scholar-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: spelling-scholar-fe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: spelling-scholar-fe/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.DEV_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.DEV_VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_VITE_SUPABASE_PUBLISHABLE_KEY }}

  verify:
    name: Verify Secrets
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify Environment Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && MISSING="$MISSING VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && MISSING="$MISSING VERCEL_ORG_ID"
          [ -z "${{ secrets.DEV_VERCEL_PROJECT_ID }}" ] && MISSING="$MISSING DEV_VERCEL_PROJECT_ID"
          [ -z "${{ secrets.DEV_VITE_API_BASE_URL }}${{ secrets.DEV_API_BASE_URL }}" ] && MISSING="$MISSING DEV_VITE_API_BASE_URL"
          [ -z "${{ secrets.DEV_VITE_SENTRY_DSN }}${{ secrets.DEV_SENTRY_DSN }}" ] && MISSING="$MISSING DEV_VITE_SENTRY_DSN"
          [ -z "${{ secrets.DEV_VITE_SUPABASE_URL }}${{ secrets.DEV_SUPABASE_URL }}" ] && MISSING="$MISSING DEV_VITE_SUPABASE_URL"
          [ -z "${{ secrets.DEV_VITE_SUPABASE_PUBLISHABLE_KEY }}${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}" ] && MISSING="$MISSING DEV_VITE_SUPABASE_PUBLISHABLE_KEY"
          [ -z "${{ secrets.DEV_VITE_TIDIO_TRACK_ID }}" ] && MISSING="$MISSING DEV_VITE_TIDIO_TRACK_ID"
          [ -z "${{ secrets.DEV_VITE_GOOGLE_ANALYTICS_ID }}" ] && MISSING="$MISSING DEV_VITE_GOOGLE_ANALYTICS_ID"
          [ -z "${{ secrets.DEV_VITE_SUBSCRIPTION_PRICE }}" ] && MISSING="$MISSING DEV_VITE_SUBSCRIPTION_PRICE"
          [ -z "${{ secrets.DEV_E2E_USER_EMAIL }}" ] && MISSING="$MISSING DEV_E2E_USER_EMAIL"
          [ -z "${{ secrets.DEV_E2E_USER_PASSWORD }}" ] && MISSING="$MISSING DEV_E2E_USER_PASSWORD"
          
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub Secrets:$MISSING"
            exit 1
          fi

  deploy:
    name: Deploy to Vercel (Dev)
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: ./spelling-scholar-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: spelling-scholar-fe

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # NOTE:
      # This workflow deploys to the Production environment of the dedicated
      # Development Vercel project (DEV_VERCEL_PROJECT_ID).
      # The custom domain dev.brightbee.ai is mapped to Production deployments,
      # therefore --prod is intentional.
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.DEV_VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.DEV_VITE_API_BASE_URL || secrets.DEV_API_BASE_URL }}" > .env.production
          echo "VITE_SENTRY_DSN=${{ secrets.DEV_VITE_SENTRY_DSN || secrets.DEV_SENTRY_DSN }}" >> .env.production
          echo "VITE_SUPABASE_URL=${{ secrets.DEV_VITE_SUPABASE_URL || secrets.DEV_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.DEV_VITE_SUPABASE_PUBLISHABLE_KEY || secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}" >> .env.production
          echo "VITE_TIDIO_TRACK_ID=${{ secrets.DEV_VITE_TIDIO_TRACK_ID }}" >> .env.production
          echo "VITE_GOOGLE_ANALYTICS_ID=${{ secrets.DEV_VITE_GOOGLE_ANALYTICS_ID }}" >> .env.production
          echo "VITE_SUBSCRIPTION_PRICE=${{ secrets.DEV_VITE_SUBSCRIPTION_PRICE }}" >> .env.production
          mkdir -p .vercel
          cp .env.production .vercel/.env.production.local
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.DEV_VERCEL_PROJECT_ID }}
          VITE_APP_ENV: development
          VITE_API_BASE_URL: ${{ secrets.DEV_VITE_API_BASE_URL || secrets.DEV_API_BASE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.DEV_VITE_SENTRY_DSN || secrets.DEV_SENTRY_DSN }}
          VITE_SUPABASE_URL: ${{ secrets.DEV_VITE_SUPABASE_URL || secrets.DEV_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_VITE_SUPABASE_PUBLISHABLE_KEY || secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TIDIO_TRACK_ID: ${{ secrets.DEV_VITE_TIDIO_TRACK_ID }}
          VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.DEV_VITE_GOOGLE_ANALYTICS_ID }}
          VITE_SUBSCRIPTION_PRICE: ${{ secrets.DEV_VITE_SUBSCRIPTION_PRICE }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "url=https://dev.brightbee.ai" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.DEV_VERCEL_PROJECT_ID }}

      - name: Create Deployment Summary
        run: |
          echo "### 🚀 Vercel Dev Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL:** [${{ env.DEPLOY_URL }}](${{ env.DEPLOY_URL }})" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.description }}" ]; then
            echo "- **Description/Notes:** ${{ github.event.inputs.description }}" >> $GITHUB_STEP_SUMMARY
          fi

  e2e_test:
    name: Run E2E Tests
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./spelling-scholar-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: spelling-scholar-fe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: spelling-scholar-fe/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          BASE_URL: https://dev.brightbee.ai
          E2E_USER_EMAIL: ${{ secrets.DEV_E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.DEV_E2E_USER_PASSWORD }}
